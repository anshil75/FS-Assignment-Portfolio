<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#7b2ff7" />
      <stop offset="100%" stop-color="#ff4ecd" />
    </linearGradient>
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ff4ecd" stop-opacity="0.08" />
    </linearGradient>
    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Outer Shield -->
  <polygon points="50,6 88,26 88,74 50,94 12,74 12,26" 
           stroke="url(#auroraGrad)" stroke-width="3.5" 
           fill="url(#glassFill)" stroke-linejoin="round" />

  <!-- Code bracket: Left < -->
  <path d="M 28 42 L 20 50 L 28 58" 
        stroke="#00e5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code bracket: Right > -->
  <path d="M 72 42 L 80 50 L 72 58" 
        stroke="#ff4ecd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Monogram A -->
  <path d="M 50 24 L 34 68 L 41.5 68 L 45.5 56 L 54.5 56 L 58.5 68 L 66 68 Z" 
        fill="url(#auroraGrad)" />
  <polygon points="50,37 47,49 53,49" fill="#070913" />

  <!-- Monogram S dynamic accent wave -->
  <path d="M 41.5 61 C 45 58 55 58 58.5 61 C 61 63.5 56.5 68.5 50 68.5 C 43 68.5 39.5 73.5 42.5 76 C 46.5 78.5 57.5 78.5 60.5 75" 
        stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
</svg>
